};

// ==== ステータス初期化 ====
let serverStatus = {};
Object.keys(servers).forEach(name => {
  serverStatus[name] = {
    health: "待機中",
    fee: "待機中"
  };
});

// ==== 描画 ====
function render() {
  const area = document.getElementById("status-area");
  area.innerHTML = "";

  Object.entries(serverStatus).forEach(([name, st]) => {
    area.innerHTML += `
      <div class="server-box">
        <b>${name}</b><br>
        Health-check :
        <span class="${st.health === "OK" ? "status-ok" : "status-ng"}">
          ${st.health}
        </span><br>
        Fee-info (RPC) :
        <span class="${st.fee === "OK" ? "status-ok" : "status-ng"}">
          ${st.fee}
        </span>
      </div>
    `;
  });
}

// ==== 15分に1回：health-check（プロセス生存） ====
async function runHealthCheck() {
  for (const [name, url] of Object.entries(servers)) {
    try {
      const res = await fetch(url + "/health-check", {
        cache: "no-store",
        signal: AbortSignal.timeout(5000)
      });
      serverStatus[name].health = res.status === 200 ? "OK" : "NG";
    } catch {
      serverStatus[name].health = "NG";
    }
  }
  render();
}

// ==== 30分に1回：fee-info（RPC実動チェック） ====
async function runFeeCheck() {
  for (const [name, url] of Object.entries(servers)) {
    try {
      const res = await fetch(url + "/fee-info", {
        cache: "no-store",
        signal: AbortSignal.timeout(5000)
      });

      if (!res.ok) {
        serverStatus[name].fee = "NG";
        continue;
      }

      const text = await res.text();

      // 🔑 balanceっぽい数値が取れたらRPC正常
      serverStatus[name].fee =
        text.match(/[0-9]{10,}/) ? "OK" : "NG";

    } catch {
      serverStatus[name].fee = "NG";
    }
  }
  render();
}

// ==== 初回実行 ====
render();
runHealthCheck();
runFeeCheck();

// ==== タイマー ====
// health-check：15分
setInterval(runHealthCheck, 900000);

// fee-info：30分
setInterval(runFeeCheck, 1800000);
</script>

</body>
