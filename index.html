<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>INTMAX Builder Monitor (Optimized)</title>
<style>
body { font-family: Arial; padding: 20px; background: #111; color: #eee; }
.server-box { padding: 12px; margin: 8px 0; background: #222; border-radius: 8px; }
.status-ok { color: #00ff88; font-weight: bold; }
.status-ng { color: #ff4444; font-weight: bold; }
</style>
</head>
<body>

<h2>INTMAX Block Builder Monitor (Optimized)</h2>
<p>15〜30分間隔の軽量監視に変更済み</p>

<div id="status-area"></div>

<script>
// ==== あなたのサーバーUUID一覧 ====
const servers = {
    "Server1": "https://proxy.builder.intmax.io/a7af75bc-1697-4d2a-8e2e-ed86ca807659",    
    "Server2": "https://proxy.builder.intmax.io/1099a9b4-8745-4f48-befe-eeca93b5da33",
    "Server3": "https://proxy.builder.intmax.io/b007ee19-6a4f-4de4-af88-74d3caf2f584",
    "Server4": "https://proxy.builder.intmax.io/6ddf3d0f-9faf-4d88-bd23-ab3de0a9cebf",
    "Server5": "https://proxy.builder.intmax.io/846d119b-b3b9-4a0d-8ad8-f997f7d6db82",
    "Server6": "https://proxy.builder.intmax.io/f9a191e3-5e23-4930-ac09-5b0238a99272",
    "Server7": "https://proxy.builder.intmax.io/d6831d7d-5e1e-4fde-bf58-7562b9e1a9c3",
    "Server8": "https://proxy.builder.intmax.io/cc171032-e997-4827-80cf-df25b1bbb0d0",
    "Server9": "https://proxy.builder.intmax.io/4f351c3d-0234-49f1-9d62-d4cf007bfd02",
    "Server10": "https://proxy.builder.intmax.io/345832da-ae36-442c-b887-a063399acf31",
    "Server11": "https://proxy.builder.intmax.io/76e93b69-564c-4e85-8800-a22548b029ad",
    "Server12": "https://proxy.builder.intmax.io/6846800d-1d8c-4e8d-a087-12ac3208b097",
    "Server13": "https://proxy.builder.intmax.io/650a55ce-7a91-4144-8080-115f4d3d7757",
    "Server14": "https://proxy.builder.intmax.io/b54be6c0-2b39-45c3-8e1c-94addfebfdc3",
    "Server15": "https://proxy.builder.intmax.io/1f7a2dfa-9b89-4d44-a47c-147c99188ae1",
    "Server16": "https://proxy.builder.intmax.io/58ecc289-3ff8-49e1-a209-c4b6eb177585",
    "Server17": "https://proxy.builder.intmax.io/eccd86c9-48f5-4c4c-abaf-d7d42251a434",
    "Server18": "https://proxy.builder.intmax.io/e5d43097-99dc-4a10-a33b-06c995550515",
    "Server19": "https://proxy.builder.intmax.io/7b8caf44-8cb0-4457-a9bb-8756e2236a44",
    "Server20": "https://proxy.builder.intmax.io/d65e5e8b-2899-4e37-b2ef-4549a9fda787",
    "Server21": "https://proxy.builder.intmax.io/5297a7c5-3f22-4bd3-8a3f-9f3220882e5d",
    "Server22": "https://proxy.builder.intmax.io/e2ff73d7-eef2-40da-8ff9-86311d87ddb7",
    "Server23": "https://proxy.builder.intmax.io/511e1e70-28f9-433d-ba7f-4e008fe2b642",
    "Server24": "https://proxy.builder.intmax.io/cb3104b7-ee26-4ea2-8409-52caa065f415",
    "Server25": "https://proxy.builder.intmax.io/3830394d-17a0-4d39-8839-6e315b1bbd4d",
    "Server26": "https://proxy.builder.intmax.io/96e43ee4-a0d9-4122-a894-eceb6d478599",
    "Server27": "https://proxy.builder.intmax.io/a2170d64-6ba0-4f6c-9a0e-c322ab73564b",
    "Server28": "https://proxy.builder.intmax.io/23200be7-5f5d-46e3-a16d-bbc1f1abe1e0",
    "Server29": "https://proxy.builder.intmax.io/08dd0e55-bf4b-46cb-8870-39d1870663ed"
};

// ==== 各サーバーのステータス ====
let serverStatus = {};
Object.keys(servers).forEach(name => {
    serverStatus[name] = { health: "待機中", fee: "待機中" };
});

// ==== 表示アップデート ====
function render() {
    const area = document.getElementById("status-area");
    area.innerHTML = "";
    Object.entries(serverStatus).forEach(([name, st]) => {
        area.innerHTML += `
            <div class="server-box">
                <b>${name}</b><br>
                Health-check : <span class="${st.health === "OK" ? "status-ok" : "status-ng"}">${st.health}</span><br>
                Fee-info : <span class="${st.fee === "OK" ? "status-ok" : "status-ng"}">${st.fee}</span>
            </div>
        `;
    });
}

// ==== 15分に1回：health-check ====
async function runHealthCheck() {
    for (const [name, url] of Object.entries(servers)) {
        try {
            const res = await fetch(url + "/health-check", { cache: "no-store" });
            serverStatus[name].health = res.status === 200 ? "OK" : "NG";
        } catch (_) {
            serverStatus[name].health = "NG";
        }
    }
    render();
}

// ==== 30分に1回：fee-info ====
async function runFeeCheck() {
    for (const [name, url] of Object.entries(servers)) {
        try {
            const res = await fetch(url + "/fee-info", { cache: "no-store" });
            serverStatus[name].fee = res.status === 200 ? "OK" : "NG";
        } catch (_) {
            serverStatus[name].fee = "NG";
        }
    }
    render();
}

// ==== 初回実行 ====
render();
runHealthCheck();
runFeeCheck();

// ==== タイマー設定 ====
// health-check：15分 (900,000ms)
setInterval(runHealthCheck, 900000);

// fee-info：30分 (1,800,000ms)
setInterval(runFeeCheck, 1800000);
</script>

</body>
</html>
