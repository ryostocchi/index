<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>INTMAX Builder Monitor (Optimized)</title>
<style>
body { font-family: Arial; padding: 20px; background: #111; color: #eee; }
.server-box { padding: 12px; margin: 8px 0; background: #222; border-radius: 8px; }
.status-ok { color: #00ff88; font-weight: bold; }
.status-ng { color: #ff4444; font-weight: bold; }
</style>
</head>
<body>

<h2>INTMAX Block Builder Monitor (Optimized)</h2>
<p>15〜30分間隔の軽量監視に変更済み</p>

<div id="status-area"></div>

<script>
// ==== あなたのサーバーUUID一覧 ====
const servers = {
    "Server1": "https://proxy.builder.intmax.io/f7a0ae76-a793-44d7-87a1-fb131ec62863",
    "Server2": "https://proxy.builder.intmax.io/ae3fe3b7-4c6a-4c21-be5a-22631bee4650",
    "Server3": "https://proxy.builder.intmax.io/40722dbc-cf79-444a-b280-f870baf88ebf",
    "Server4": "https://proxy.builder.intmax.io/799d8403-af11-40d0-a7ae-40d0fad0333e",
    "Server5": "https://proxy.builder.intmax.io/a7af75bc-1697-4d2a-8e2e-ed86ca807659",
    "Server6": "https://proxy.builder.intmax.io/1099a9b4-8745-4f48-befe-eeca93b5da33",
    "Server7": "https://proxy.builder.intmax.io/b007ee19-6a4f-4de4-af88-74d3caf2f584",
    "Server8": "https://proxy.builder.intmax.io/6ddf3d0f-9faf-4d88-bd23-ab3de0a9cebf",
    "Server9": "https://proxy.builder.intmax.io/846d119b-b3b9-4a0d-8ad8-f997f7d6db82",
    "Server10": "https://proxy.builder.intmax.io/f9a191e3-5e23-4930-ac09-5b0238a99272",
    "Server11": "https://proxy.builder.intmax.io/8bf429c7-02f5-4e16-a6dc-1a4ec43c0ec2",
    "Server12": "https://proxy.builder.intmax.io/d6831d7d-5e1e-4fde-bf58-7562b9e1a9c3",
    "Server13": "https://proxy.builder.intmax.io/cc171032-e997-4827-80cf-df25b1bbb0d0"
};

// ==== 各サーバーのステータス ====
let serverStatus = {};
Object.keys(servers).forEach(name => {
    serverStatus[name] = { health: "待機中", fee: "待機中" };
});

// ==== 表示アップデート ====
function render() {
    const area = document.getElementById("status-area");
    area.innerHTML = "";
    Object.entries(serverStatus).forEach(([name, st]) => {
        area.innerHTML += `
            <div class="server-box">
                <b>${name}</b><br>
                Health-check : <span class="${st.health === "OK" ? "status-ok" : "status-ng"}">${st.health}</span><br>
                Fee-info : <span class="${st.fee === "OK" ? "status-ok" : "status-ng"}">${st.fee}</span>
            </div>
        `;
    });
}

// ==== 15分に1回：health-check ====
async function runHealthCheck() {
    for (const [name, url] of Object.entries(servers)) {
        try {
            const res = await fetch(url + "/health-check", { cache: "no-store" });
            serverStatus[name].health = res.status === 200 ? "OK" : "NG";
        } catch (_) {
            serverStatus[name].health = "NG";
        }
    }
    render();
}

// ==== 30分に1回：fee-info ====
async function runFeeCheck() {
    for (const [name, url] of Object.entries(servers)) {
        try {
            const res = await fetch(url + "/fee-info", { cache: "no-store" });
            serverStatus[name].fee = res.status === 200 ? "OK" : "NG";
        } catch (_) {
            serverStatus[name].fee = "NG";
        }
    }
    render();
}

// ==== 初回実行 ====
render();
runHealthCheck();
runFeeCheck();

// ==== タイマー設定 ====
// health-check：15分 (900,000ms)
setInterval(runHealthCheck, 900000);

// fee-info：30分 (1,800,000ms)
setInterval(runFeeCheck, 1800000);
</script>

</body>
</html>
